services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: secret
      NEO4J_DATABASE: neo4j
    depends_on:
      - neo4j
    # By default do not mount the source (use built image). For development, see app-dev service below.

  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/secret
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Optional development service that mounts the source directory for live editing.
  app-dev:
    build: .
    ports:
      - "8001:8000"
    environment:
      APP_ENV: local
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: secret
      NEO4J_DATABASE: neo4j
    depends_on:
      - neo4j
    volumes:
      - ./:/var/www/html
    command: php artisan serve --host=0.0.0.0 --port=8000

volumes:
  neo4j_data:
