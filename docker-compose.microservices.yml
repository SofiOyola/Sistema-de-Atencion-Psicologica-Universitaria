services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/microservices.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - auth-service
      - resources-service
      - student-service
      - psychologist-service
      - admin-service

  frontend:
    build: .
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8080
      ASSET_URL: http://localhost:8080
      SESSION_DRIVER: file
      SAPU_SERVICE: frontend
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: secret1234
      NEO4J_DATABASE: neo4j
    depends_on:
      - neo4j

  auth-service:
    build: .
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      SESSION_DRIVER: file
      SAPU_SERVICE: auth
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: secret1234
      NEO4J_DATABASE: neo4j
    depends_on:
      - neo4j

  resources-service:
    build: .
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      SESSION_DRIVER: file
      SAPU_SERVICE: resources
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: secret1234
      NEO4J_DATABASE: neo4j
    depends_on:
      - neo4j

  student-service:
    build: .
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      SESSION_DRIVER: file
      SAPU_SERVICE: student
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: secret1234
      NEO4J_DATABASE: neo4j
    depends_on:
      - neo4j

  psychologist-service:
    build: .
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      SESSION_DRIVER: file
      SAPU_SERVICE: psychologist
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: secret1234
      NEO4J_DATABASE: neo4j
    depends_on:
      - neo4j

  admin-service:
    build: .
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      SESSION_DRIVER: file
      SAPU_SERVICE: admin
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: secret1234
      NEO4J_DATABASE: neo4j
    depends_on:
      - neo4j

  neo4j:
    image: neo4j:5
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      - NEO4J_AUTH=neo4j/secret1234
    volumes:
      - neo4j_microservices_data:/data

volumes:
  neo4j_microservices_data:
