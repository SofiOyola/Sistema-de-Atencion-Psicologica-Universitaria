version: "3.9"
services:
  laravel:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: laravel_dev
    working_dir: /var/www/html
    ports:
      - "8001:8000"
    volumes:
      - ./:/var/www/html
      # Excluir vendor para que no se sobrescriba con el host
      - /var/www/html/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8001
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: secret1234
      NEO4J_DATABASE: neo4j
    depends_on:
      - neo4j
    # El entrypoint se encarga de tareas condicionales, luego ejecuta el CMD

  vite:
    image: node:20
    container_name: vite_dev
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./resources:/app/resources
      - ./public:/app/public
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - ./vite.config.js:/app/vite.config.js
      # Excluir node_modules para evitar conflictos con el host
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"

  neo4j:
    image: neo4j:5
    container_name: neo4j_dev
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/secret1234
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data: